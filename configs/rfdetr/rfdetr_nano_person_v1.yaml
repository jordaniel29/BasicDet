# RF-DETR person-detection fine-tuning experiment.
# Loaded into a typed RFDETRExperimentConfig (basicdet/config.py).
#
# Hyperparameters are aligned with configs/yolo/yolo26n_person_v1.yaml (epochs, effective
# batch, workers, seed, early-stop patience) for a fair comparison — EXCEPT the
# learning rate: RF-DETR is a DETR transformer and needs a low AdamW LR (~1e-4);
# YOLO's 0.01 would diverge. Same training budget, architecture-appropriate LR.

family: rfdetr          # selects the RF-DETR pipeline (see basicdet/train.py)

data:
  # COCO-layout dir with train/ valid/ test/, each + an _annotations.coco.json.
  dataset_dir: assets/data/persondet_v1.1/rfdetr

model:
  variant: nano           # nano | small | medium | base | large
  resolution: null        # null = variant default; if set, must be divisible by 56
  num_classes: null       # null = infer from dataset (correct for single-class person)

train:
  epochs: 100             # match YOLO
  batch_size: 16          # match YOLO's batch (96GB VRAM handles this for nano)
  grad_accum_steps: 1     # effective batch = 16, same as YOLO
  lr: 0.0001              # DETR-appropriate; intentionally NOT YOLO's 0.01 (see header)
  num_workers: 8          # match YOLO
  seed: 42                # match YOLO
  early_stopping: true
  tensorboard: false
  output_dir: runs/rfdetr/rfdetr_nano_person
  run_name: rfdetr_nano_person
  extra:
    early_stopping_patience: 50   # match YOLO's patience: 50

wandb:
  enabled: true
  project: person-det
  entity: null            # null = your default W&B entity
  log_model: true
