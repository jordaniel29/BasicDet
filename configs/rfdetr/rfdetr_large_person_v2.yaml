# RF-DETR LARGE fine-tuning on the persondet_v2.1 dataset.
# Same setup as configs/rfdetr/rfdetr_nano_person_v2.yaml, but the LARGE variant
# with a SMALL physical batch — RF-DETR-large is very VRAM-heavy (nano already
# hit ~99% of 97GB at batch 16). batch_size 4 x grad_accum 4 = effective batch
# 16, matching the other runs' training budget at ~1/4 the memory.

family: rfdetr          # selects the RF-DETR pipeline (see basicdet/train.py)

data:
  dataset_dir: assets/data/persondet_v2.1/rfdetr

model:
  variant: large          # nano | small | medium | base | large
  resolution: null        # null = variant default; if set, must be divisible by 56
  num_classes: null       # null = infer from dataset (correct for single-class person)

train:
  epochs: 100
  batch_size: 4           # small physical batch (RF-DETR-large is memory-heavy)
  grad_accum_steps: 4     # effective batch = 4 x 4 = 16 (same budget as other runs)
  lr: 0.0001              # DETR-appropriate AdamW LR (intentionally NOT YOLO's 0.01)
  num_workers: 8
  seed: 42
  early_stopping: true
  tensorboard: false
  output_dir: runs/rfdetr/rfdetr_large_person_v2
  run_name: rfdetr_large_person_v2
  extra:
    early_stopping_patience: 50

wandb:
  enabled: true
  project: person-det
  entity: null            # null = your default W&B entity
  log_model: true
