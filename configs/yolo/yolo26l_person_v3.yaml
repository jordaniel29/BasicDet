# YOLO26-L fine-tuning on the persondet_v3.1 dataset (indoor CCTV: WiseNET +
# CCTV Roboflow). Same setup as configs/yolo/yolo26l_person_v2.yaml; only the
# dataset and run name differ — so v2 and v3 results stay separate and comparable.

family: yolo            # selects the YOLO pipeline (see basicdet/train.py)

data:
  yaml_path: assets/data/persondet_v3.1/data.yaml

model:
  # YOLO26 variants: yolo26n / yolo26s / yolo26m / yolo26l / yolo26x (.pt).
  weights: yolo26l.pt
  imgsz: 640

train:
  epochs: 100
  batch: 16            # L is ~10x nano; 96GB VRAM handles batch 64 at 640px
  optimizer: auto
  lr0: 0.01
  patience: 50         # early-stop after N epochs without val improvement
  workers: 16
  seed: 42
  device: auto         # auto | cpu | "0" | "0,1"
  fraction: 1.0        # fraction of train set; lower (e.g. 0.02) for quick smoke runs
  cache: ram           # cache decoded images in RAM (small dataset — trivial)
  deterministic: false # enable cuDNN autotuning for speed
  project: yolo26        # runs land in runs/detect/<project>/<name>
  name: yolo26l_person_v3

wandb:
  enabled: true
  project: person-det
  entity: null         # null = your default W&B entity
  log_model: true      # upload best.pt as a W&B artifact at train end
