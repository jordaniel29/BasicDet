# YOLO26n fine-tuning on the persondet_v2.1 dataset.
# Mirrors configs/yolo/yolo26n_person_v1.yaml (v1.1); only the dataset, run name, and
# W&B run differ — so v1 and v2 results stay separate and comparable.

family: yolo            # selects the YOLO pipeline (see basicdet/train.py)

data:
  yaml_path: assets/data/persondet_v2.1/data.yaml

model:
  # YOLO26 variants: yolo26n / yolo26s / yolo26m / yolo26l / yolo26x (.pt).
  weights: yolo26n.pt
  imgsz: 640

train:
  epochs: 100
  batch: 64            # GPU has 96GB; nano barely uses it — large batch is fine
  optimizer: auto
  lr0: 0.01
  patience: 50         # early-stop after N epochs without val improvement
  workers: 16
  seed: 42
  device: auto         # auto | cpu | "0" | "0,1"
  fraction: 1.0        # fraction of train set; lower (e.g. 0.02) for quick smoke runs
  cache: ram           # cache decoded images in RAM — fixes the data-loading bottleneck
  deterministic: false # enable cuDNN autotuning for speed
  project: yolo26        # runs land in runs/detect/<project>/<name>
  name: yolo26n_person_v2

wandb:
  enabled: true
  project: person-det
  entity: null         # null = your default W&B entity
  log_model: true      # upload best.pt as a W&B artifact at train end
