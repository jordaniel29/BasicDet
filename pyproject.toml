[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["basicdet*"]

[project]
name = "basicdet"
version = "0.1.0"
description = "A base framework for fine-tuning and evaluating object-detection models (YOLO26, RF-DETR)."
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "rfdetr>=1.0",
    "supervision>=0.22",
    "pycocotools>=2.0",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "wandb>=0.17",
]

[project.optional-dependencies]
# Dev tooling — installed into the conda env with `pip install -e ".[dev]"`.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# SIM: simplify, N: pep8-naming.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

# ML libraries often ship without type stubs — don't fail on missing imports.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "ultralytics.*",
    "rfdetr.*",
    "supervision.*",
    "pycocotools.*",
    "PIL.*",
    "tqdm",
    "cv2",
]
ignore_missing_imports = true

# wandb ships an incomplete py.typed whose top-level API (init/log/Artifact/...)
# is exported dynamically — mypy flags it as "no attribute" when wandb isn't
# importable (e.g. pre-commit's isolated env). Skip following it -> treat as Any
# everywhere, so type-checking doesn't depend on whether wandb is installed.
[[tool.mypy.overrides]]
module = ["wandb", "wandb.*"]
ignore_missing_imports = true
follow_imports = "skip"
