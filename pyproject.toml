[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "person-det"
version = "0.1.0"
description = "Fine-tuning and evaluation of object-detection models (YOLO26, RF-DETR) for person detection."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dev tooling — installed into the conda env with `pip install -e ".[dev]"`.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# SIM: simplify, N: pep8-naming.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

# ML libraries often ship without type stubs — don't fail on missing imports.
[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "cv2.*", "numpy.*", "ultralytics.*"]
ignore_missing_imports = true
