# Runs automatically on `git commit` (after `pre-commit install`).
# Manually run on everything: `pre-commit run --all-files`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      # Linter (with autofix), then formatter.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # Type-check the package source. Adjust the path as the repo grows.
        files: ^basicdet/
        additional_dependencies: []

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files   # blocks accidental dataset/checkpoint commits
        args: [--maxkb=5000]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
